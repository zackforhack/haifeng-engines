<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" role="img" aria-label="120/240V single-phase split-phase: two 120 V legs to neutral, 240 V between Line 1 and Line 2.">
  <defs>
    <marker id="ahsp" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#374151"/></marker>
  </defs>
  <rect width="660" height="300" rx="14" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="30" y="40" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#111827">120 / 240 V — Single-Phase (Split-Phase)</text>

  <!-- vertical secondary winding with center tap -->
  <path d="M110,80 a9,9 0 0 1 0,18 a9,9 0 0 1 0,18 a9,9 0 0 1 0,18 a9,9 0 0 1 0,18 a9,9 0 0 1 0,18 a9,9 0 0 1 0,18 a9,9 0 0 1 0,18 a9,9 0 0 1 0,18 a9,9 0 0 1 0,18 a9,9 0 0 1 0,18" fill="none" stroke="#6b7280" stroke-width="3"/>
  <circle cx="110" cy="170" r="4" fill="#6b7280"/>

  <!-- buses -->
  <g stroke-width="3">
    <line x1="110" y1="80"  x2="560" y2="80"  stroke="#111827"/>
    <line x1="119" y1="170" x2="560" y2="170" stroke="#6b7280"/>
    <line x1="110" y1="260" x2="560" y2="260" stroke="#dc2626"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700">
    <text x="568" y="85"  fill="#111827">Line 1</text>
    <text x="568" y="175" fill="#6b7280">Neutral</text>
    <text x="568" y="265" fill="#dc2626">Line 2</text>
  </g>

  <!-- 120 (L1-N) -->
  <line x1="300" y1="80" x2="300" y2="170" stroke="#374151" stroke-width="1.5" marker-start="url(#ahsp)" marker-end="url(#ahsp)"/>
  <rect x="270" y="111" width="60" height="28" rx="6" fill="#eff6ff" stroke="#dbeafe"/>
  <text x="300" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">120 V</text>
  <!-- 120 (N-L2) -->
  <line x1="300" y1="170" x2="300" y2="260" stroke="#374151" stroke-width="1.5" marker-start="url(#ahsp)" marker-end="url(#ahsp)"/>
  <rect x="270" y="201" width="60" height="28" rx="6" fill="#eff6ff" stroke="#dbeafe"/>
  <text x="300" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">120 V</text>
  <!-- 240 (L1-L2) -->
  <line x1="430" y1="80" x2="430" y2="260" stroke="#374151" stroke-width="1.5" marker-start="url(#ahsp)" marker-end="url(#ahsp)"/>
  <rect x="400" y="156" width="60" height="28" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="430" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#b45309">240 V</text>
</svg>
