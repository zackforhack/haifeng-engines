<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" role="img" aria-label="EPA diesel emission tiers from Tier 1 (1996) to Tier 4 Final (2015), showing combined NOx and particulate emissions falling by more than 90 percent.">
  <rect width="660" height="380" rx="14" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="30" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">EPA Diesel Tiers: Emissions Over Time</text>
  <text x="30" y="63" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">Combined NOx + particulate matter, relative to Tier 1 (illustrative).</text>

  <!-- baseline -->
  <line x1="40" y1="300" x2="630" y2="300" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- bars: relative emissions descending -->
  <!-- Tier 1: 100% -> h=210 -->
  <rect x="60"  y="90"  width="92" height="210" rx="5" fill="#dc2626"/>
  <text x="106" y="80"  text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">100%</text>
  <!-- Tier 2: 50% -> h=105 -->
  <rect x="178" y="195" width="92" height="105" rx="5" fill="#ea580c"/>
  <text x="224" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#c2410c">~50%</text>
  <!-- Tier 3: 35% -> h=74 -->
  <rect x="296" y="226" width="92" height="74" rx="5" fill="#d97706"/>
  <text x="342" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#b45309">~35%</text>
  <!-- Tier 4 Interim: 12% -> h=25 -->
  <rect x="414" y="275" width="92" height="25" rx="5" fill="#65a30d"/>
  <text x="460" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#4d7c0f">~12%</text>
  <!-- Tier 4 Final: ~3% -> h=8 -->
  <rect x="532" y="292" width="92" height="8" rx="3" fill="#16a34a"/>
  <text x="578" y="283" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#15803d">~3%</text>

  <!-- labels -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="106" y="322" font-size="13" font-weight="700" fill="#111827">Tier 1</text>
    <text x="106" y="340" font-size="11" fill="#6b7280">1996</text>
    <text x="224" y="322" font-size="13" font-weight="700" fill="#111827">Tier 2</text>
    <text x="224" y="340" font-size="11" fill="#6b7280">2001</text>
    <text x="342" y="322" font-size="13" font-weight="700" fill="#111827">Tier 3</text>
    <text x="342" y="340" font-size="11" fill="#6b7280">2006</text>
    <text x="460" y="322" font-size="13" font-weight="700" fill="#111827">Tier 4i</text>
    <text x="460" y="340" font-size="11" fill="#6b7280">2008–11</text>
    <text x="578" y="322" font-size="13" font-weight="700" fill="#111827">Tier 4 Final</text>
    <text x="578" y="340" font-size="11" fill="#6b7280">2014–15</text>
  </g>
  <text x="30" y="367" font-family="Arial, sans-serif" font-size="10.5" fill="#9ca3af">Tier 4 Final needs aftertreatment (DPF + SCR/DEF). Exact dates phase in by engine power band.</text>
</svg>
