<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" role="img" aria-label="240V high-leg delta: phases 240 V apart, A and C give 120 V to neutral, and the B wild leg reads 208 V to neutral.">
  <defs>
    <marker id="ahhl" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#374151"/></marker>
  </defs>
  <rect width="660" height="330" rx="14" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="30" y="40" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#111827">240 V High-Leg (Wild-Leg) Delta</text>

  <!-- delta source: triangle A(70,150)-C(70,272)-B(168,211); A-C side centre-tapped -->
  <polygon points="70,150 168,211 70,272" fill="none" stroke="#374151" stroke-width="3"/>
  <circle cx="70" cy="150" r="4.5" fill="#111827"/>
  <circle cx="70" cy="272" r="4.5" fill="#1d4ed8"/>
  <circle cx="168" cy="211" r="4.5" fill="#b45309"/>
  <circle cx="70" cy="211" r="4" fill="#6b7280"/>
  <g font-family="Arial, sans-serif" font-size="12" font-weight="700">
    <text x="44" y="148" fill="#111827">A</text>
    <text x="44" y="278" fill="#1d4ed8">C</text>
    <text x="176" y="215" fill="#b45309">B</text>
  </g>

  <!-- buses: B(92) wild, A(150), N(211), C(272) -->
  <g stroke-width="3" fill="none">
    <path d="M168,211 L168,92 L560,92" stroke="#b45309"/>
    <line x1="70" y1="150" x2="560" y2="150" stroke="#111827"/>
    <line x1="70" y1="211" x2="560" y2="211" stroke="#6b7280" stroke-dasharray="2 0"/>
    <line x1="70" y1="272" x2="560" y2="272" stroke="#1d4ed8"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700">
    <text x="568" y="97"  fill="#b45309">B</text>
    <text x="568" y="155" fill="#111827">A</text>
    <text x="568" y="216" fill="#6b7280">N</text>
    <text x="568" y="277" fill="#1d4ed8">C</text>
  </g>
  <text x="408" y="86" font-family="Arial, sans-serif" font-size="11" fill="#b45309">wild leg — no 120 V loads</text>

  <!-- 240 (B-A) -->
  <line x1="285" y1="92" x2="285" y2="150" stroke="#374151" stroke-width="1.5" marker-start="url(#ahhl)" marker-end="url(#ahhl)"/>
  <rect x="255" y="107" width="60" height="26" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="285" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#b45309">240 V</text>
  <!-- 120 (A-N) -->
  <line x1="285" y1="150" x2="285" y2="211" stroke="#374151" stroke-width="1.5" marker-start="url(#ahhl)" marker-end="url(#ahhl)"/>
  <rect x="255" y="167" width="60" height="26" rx="6" fill="#eff6ff" stroke="#dbeafe"/>
  <text x="285" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">120 V</text>
  <!-- 120 (N-C) -->
  <line x1="285" y1="211" x2="285" y2="272" stroke="#374151" stroke-width="1.5" marker-start="url(#ahhl)" marker-end="url(#ahhl)"/>
  <rect x="255" y="228" width="60" height="26" rx="6" fill="#eff6ff" stroke="#dbeafe"/>
  <text x="285" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">120 V</text>
  <!-- 208 wild leg (B-N) -->
  <line x1="430" y1="92" x2="430" y2="211" stroke="#dc2626" stroke-width="1.5" marker-start="url(#ahhl)" marker-end="url(#ahhl)"/>
  <rect x="398" y="138" width="64" height="26" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="430" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#dc2626">208 V</text>
</svg>
