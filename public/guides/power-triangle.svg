<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" role="img" aria-label="The power triangle: real power (kW), reactive power (kVAR) and apparent power (kVA) at a 0.8 power factor.">
  <rect width="660" height="420" rx="14" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="30" y="42" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">The Power Triangle</text>
  <text x="30" y="66" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">How kW, kVAR and kVA relate at a 0.8 power factor</text>

  <!-- triangle: base = real power, vertical = reactive, hypotenuse = apparent (3-4-5 → PF 0.8) -->
  <!-- base (140,340)->(540,340) = 400px ; vertical (540,340)->(540,40) = 300px ; hyp length 500px -->
  <polygon points="140,340 540,340 540,40" fill="#dbeafe" fill-opacity="0.5" stroke="none"/>

  <!-- real power (base) -->
  <line x1="140" y1="340" x2="540" y2="340" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <text x="340" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">Real Power — 400 kW</text>

  <!-- reactive power (vertical) -->
  <line x1="540" y1="340" x2="540" y2="40" stroke="#d97706" stroke-width="5" stroke-linecap="round"/>
  <text x="556" y="195" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#b45309" transform="rotate(90 556 195)" text-anchor="middle">Reactive Power — 300 kVAR</text>

  <!-- apparent power (hypotenuse) -->
  <line x1="140" y1="340" x2="540" y2="40" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
  <text x="312" y="170" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" transform="rotate(-36.87 312 170)" text-anchor="middle">Apparent Power — 500 kVA</text>

  <!-- right angle marker -->
  <path d="M540 318 L518 318 L518 340" fill="none" stroke="#9ca3af" stroke-width="2"/>

  <!-- phi angle arc at origin -->
  <path d="M205 340 A65 65 0 0 0 191 311" fill="none" stroke="#6b7280" stroke-width="2"/>
  <text x="214" y="326" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#374151">&#966;</text>

  <!-- formula box (inside the triangle, below the hypotenuse) -->
  <rect x="298" y="248" width="234" height="78" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="314" y="274" font-family="Arial, sans-serif" font-size="14" fill="#374151">PF = cos &#966; = kW &#247; kVA</text>
  <text x="314" y="296" font-family="Arial, sans-serif" font-size="14" fill="#374151">= 400 &#247; 500 = <tspan font-weight="700" fill="#111827">0.8</tspan></text>
  <text x="314" y="316" font-family="Arial, sans-serif" font-size="13" fill="#6b7280">kVA = kW &#247; 0.8</text>
</svg>
