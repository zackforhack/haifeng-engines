name: Production Smoke

on:
  deployment_status:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Deployed site functional and integration QA
    if: >-
      github.event_name != 'deployment_status'
      || (
        github.event.deployment_status.state == 'success'
        && (
          github.event.deployment.environment == 'Production'
          || github.event.deployment.environment == 'production'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      QA_BASE_URL: https://engines.haifengmachinery.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate required environment
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Supabase Actions secrets are required for production integration QA."
            exit 1
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Functional and integration QA
        run: npm run test:functional
