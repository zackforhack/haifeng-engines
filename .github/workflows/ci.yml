name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, type-check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate required environment
        id: env
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase Actions secrets are not configured; skipping Next.js production build in GitHub Actions. Vercel still performs the deployment build."
          fi

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Overhaul preview disclosure and SEO contracts
        run: |
          node tests/unit/overhaul-preview.mjs
          node tests/unit/engine-repair-metadata.mjs

      - name: Source-verified data QA
        if: steps.env.outputs.configured == 'true'
        env:
          DATA_QA_FAIL_ON: high
        run: npm run data:qa

      - name: Database integrity contracts
        if: steps.env.outputs.configured == 'true'
        run: npm run test:database

      - name: Linked PDF storage integrity
        if: steps.env.outputs.configured == 'true'
        run: npm run test:storage

      - name: Build
        if: steps.env.outputs.configured == 'true'
        run: npm run build

      - name: Install Playwright Chromium
        if: steps.env.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium

      - name: Functional and integration QA
        if: steps.env.outputs.configured == 'true'
        env:
          QA_BASE_URL: http://127.0.0.1:3000
        run: |
          npm run start > /tmp/haifeng-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$QA_BASE_URL/engines" > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/haifeng-next.log
              exit 1
            fi
            sleep 2
          done
          npm run test:functional
